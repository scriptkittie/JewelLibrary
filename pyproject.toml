[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "steamdeck-jewels"
version = "0.1.0"
description = "Controller-friendly jewel-drive game library for SteamOS and Windows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
steamdeck-jewels = "steamdeck_jewels.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
