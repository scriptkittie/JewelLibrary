name: Release

# Builds the Windows installer and the Linux/Steam Deck AppImage and attaches them to the release.
# Runs when a release is published on GitHub's website, or when a v* tag is pushed.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the app version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/steamdeck_jewels/__init__.py').read()).group(1))")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG doesn't match the app version $VERSION in src/steamdeck_jewels/__init__.py."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean SteamDeckJewels.spec
      - name: Check the app starts
        shell: pwsh
        run: |
          $p = Start-Process dist\SteamDeckJewels\SteamDeckJewels.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/SteamDeckJewels-Setup.exe
          if-no-files-found: error

  linux:
    name: Linux / Steam Deck AppImage
    # The oldest supported Ubuntu, so the AppImage runs on as many systems as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the app version
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/steamdeck_jewels/__init__.py').read()).group(1))")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG doesn't match the app version $VERSION in src/steamdeck_jewels/__init__.py."
            exit 1
          fi
      - name: Install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 libfontconfig1 libdbus-1-3
      - name: Build the app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean SteamDeckJewels.spec
      - name: Check the app starts
        run: QT_QPA_PLATFORM=offscreen dist/SteamDeckJewels/SteamDeckJewels --self-test
      - name: Build the AppImage
        run: bash packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/SteamDeckJewels-x86_64.AppImage
          if-no-files-found: error

  publish:
    name: Attach downloads to the release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Attach to the release
        run: |
          ls -l release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "SteamDeck Jewels $TAG" --generate-notes
          fi
