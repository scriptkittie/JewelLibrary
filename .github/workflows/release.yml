name: Release

# Push a tag such as v0.3.0 to publish a GitHub release with the Windows and SteamOS ZIPs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the code compiles
        run: python -m compileall -q src tools
      - name: Build release ZIPs
        run: python tools/package_release.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --title "SteamDeck Jewels $GITHUB_REF_NAME" --generate-notes
